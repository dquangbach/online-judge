[uwsgi]
# Listen with native uWSGI protocol on 8001 (proxied via Nginx uwsgi_pass)
socket = 0.0.0.0:8001
buffer-size = 65535

# Application configuration
chdir = /code
env = DJANGO_SETTINGS_MODULE=dmoj.settings
module = dmoj.wsgi:application
master = true
optimize = 2

# Worker scaling
workers = 4
threads = 2
enable-threads = true

# Memory and timeout limits
max-requests = 5000
max-requests-delta = 500
harakiri = 60
reload-on-rss = 450

# Process lifecycle
vacuum = true
die-on-term = true
no-orphans = true
