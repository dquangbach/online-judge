# ==============================================================================
# Nginx Production Configuration for DMOJ / DUTOJ
# Đặt tại: /etc/nginx/sites-available/online-judge
# Kích hoạt: ln -s /etc/nginx/sites-available/online-judge /etc/nginx/sites-enabled/
# ==============================================================================

# 1. Chuyển hướng toàn bộ HTTP (Port 80) sang HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name oj.yourdomain.com; # Thay thế bằng domain thực tế hoặc IP

    # Đường dẫn xác thực ACME Challenge cho Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Máy chủ HTTPS chính (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oj.yourdomain.com; # Thay thế bằng domain thực tế

    # Chứng chỉ Let's Encrypt (sẽ được sinh bởi certbot trên máy chủ)
    ssl_certificate /etc/letsencrypt/live/oj.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oj.yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/oj.yourdomain.com/chain.pem;

    # Cấu hình SSL bảo mật cao
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    charset utf-8;
    client_max_body_size 100M;

    error_page 502 504 /502.html;
    location = /502.html {
        root /opt/online-judge;
        internal;
    }

    # Phục vụ Static Files trực tiếp qua Nginx
    location /static/ {
        alias /opt/online-judge/static/;
        gzip_static on;
        expires max;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Phục vụ Media Files trực tiếp qua Nginx
    location /media/ {
        alias /opt/online-judge/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy WebSocket tới dịch vụ wsevent daemon (cổng 15100 trên host)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:15100/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Proxy ứng dụng Django qua giao thức uWSGI nhị phân (khớp chính xác với uwsgi.ini)
    location / {
        uwsgi_read_timeout 600;
        uwsgi_send_timeout 600;
        uwsgi_pass 127.0.0.1:8001;
        include uwsgi_params;
        uwsgi_param SERVER_SOFTWARE nginx/$nginx_version;
        uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
        uwsgi_param REMOTE_ADDR $remote_addr;
    }
}
